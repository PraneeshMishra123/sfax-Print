<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>SFAX Print</title><link rel="stylesheet" href="renderer.css"></head>
<body>
<div id="vLogin" class="center"><div class="card">
  <span class="badge">Post Office</span><h1>SFAX Print</h1>
  <label for="pin">Post office PIN</label><input id="pin" inputmode="numeric" maxlength="10">
  <label for="pw">Password</label><input id="pw" type="password">
  <label class="chk"><input id="create" type="checkbox"> First time: create this post office account</label>
  <div class="err" id="eLogin"></div><button class="btn" id="bLogin">Login</button>
</div></div>
<div id="vSetup" class="center hide"><div class="card">
  <h1>Set up this computer</h1>
  <p class="mute">This creates the secret key that opens messages. It stays on this computer, protected by Windows. An encrypted backup goes to the SFAX owner for recovery.</p>
  <button class="btn" id="bSetup">Create key on this computer</button>
  <p class="mute" style="margin-top:22px">Lost the key? Use the recovery file sent by the SFAX owner:</p>
  <label for="rp">Recovery passphrase</label><input id="rp" type="password">
  <button class="btn lt" id="bRecover">Choose recovery file</button>
  <div class="err" id="eSetup"></div><div class="ok" id="oSetup"></div>
</div></div>
<div id="vMain" class="hide">
  <header><b id="hTitle">SFAX Print</b><span><select id="sel"></select> <button class="btn sm lt" id="bOut">Logout</button></span></header>
  <div class="note" id="note"></div>
  <main><table><thead><tr><th>From</th><th>Route</th><th>Sealed</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <div class="mute" id="empty"></div></main>
</div>
<div class="toast hide" id="toast"></div>
<script src="renderer.js"></script>
</body></html>
